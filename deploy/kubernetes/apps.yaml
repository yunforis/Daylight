apiVersion: apps/v1
kind: Deployment
metadata:
  name: daylight-api
  namespace: daylight
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: daylight-api}
  template:
    metadata:
      labels: {app: daylight-api, app.kubernetes.io/name: daylight}
    spec:
      terminationGracePeriodSeconds: 90
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: daylight:local
          imagePullPolicy: IfNotPresent
          command: [node, server/index.js, --production]
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - configMapRef: {name: daylight-config}
            - secretRef: {name: daylight-secrets}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: [node, -e, 'setTimeout(()=>{},5000)']}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: '2', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts: [{name: temporary, mountPath: /tmp}]
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 1Gi}
---
