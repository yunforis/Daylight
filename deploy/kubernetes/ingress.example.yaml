apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: daylight
  namespace: daylight
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-body-size: 25m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [daylight.example.com]
      secretName: daylight-tls
  rules:
    - host: daylight.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: daylight-api
                port: {name: http}
